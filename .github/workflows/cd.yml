name: CD - Deploy Kubernetes

on:
  push:
    branches: [ master ]
    paths:
      - 'k8s/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

jobs:
  deploy-kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name autorepairshop-eks \
            --region us-east-1

          kubectl get nodes

      - name: Deploy ConfigMaps and Secrets
        run: |
          kubectl apply -f k8s/api-configmap.yaml -n oficina
          kubectl apply -f k8s/api-secrets.yaml -n oficina

      - name: Deploy Application
        run: |
          kubectl apply -f k8s/api-deployment.yaml -n oficina
          kubectl apply -f k8s/api-service.yaml -n oficina
          kubectl apply -f k8s/api-service-nlb.yaml -n oficina
          kubectl apply -f k8s/api-hpa.yaml -n oficina

      - name: Restart API
        run: |
          kubectl -n oficina rollout restart deployment/api
          kubectl -n oficina rollout status deployment/api --timeout=5m

      - name: Get Service Info
        run: |
          kubectl get svc,pods,hpa -n oficina
