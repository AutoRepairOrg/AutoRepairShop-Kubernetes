name: CD - Deploy Kubernetes

on:
  push:
    branches: [ master ]
    paths:
      - 'infra/**'
      - 'k8s/**'

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.6

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan -no-color

    - name: Terraform Apply
      run: terraform apply -auto-approve

    - name: Output EKS Cluster Info
      run: |
        echo "🎉 EKS Cluster deployed successfully!"
        terraform output || echo "Outputs não disponíveis"

  deploy-kubernetes:
    runs-on: ubuntu-latest
    needs: terraform-deploy

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --name autorepairshop-eks --region us-east-1

    - name: Deploy Namespace
      run: kubectl apply -f k8s/namespace.yaml

    - name: Deploy ConfigMaps and Secrets
      run: |
        kubectl apply -f k8s/api-configmap.yaml
        kubectl apply -f k8s/api-secrets.yaml

    - name: Deploy Application
      run: |
        kubectl apply -f k8s/api-deployment.yaml
        kubectl apply -f k8s/api-service-nlb.yaml
        kubectl apply -f k8s/api-hpa.yaml

    - name: Wait for Deployment
      run: |
        kubectl rollout status deployment/api -n oficina --timeout=5m

    - name: Get Service Info
      run: |
        echo "📋 Services deployed:"
        kubectl get svc -n oficina
        echo ""
        echo " Pods running:"
        kubectl get pods -n oficina
        echo ""
        echo "HPA status:"
        kubectl get hpa -n oficina
