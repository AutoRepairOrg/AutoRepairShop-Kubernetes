name: CD - Deploy Kubernetes

on:
  push:
    branches: [ master ]
    paths:
      - 'k8s/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy-kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name autorepairshop-eks \
            --region us-east-1

          kubectl get nodes

      - name: Create GHCR image pull secret
        run: |
          kubectl -n oficina create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --docker-email="${{ github.actor }}@users.noreply.github.com" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Datadog (observability)
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "❌ Secret DD_API_KEY não configurado no repositório GitHub."
            echo "Crie em Settings → Secrets → Actions → DD_API_KEY (API Key da conta Datadog)."
            exit 1
          fi

          # Token interno Agent ↔ Cluster Agent (32 chars)
          DD_TOKEN=$(openssl rand -hex 16)

          kubectl apply -f k8s/datadog-namespace.yaml

          kubectl -n datadog create secret generic datadog-secret \
            --from-literal=api-key="$DD_API_KEY" \
            --from-literal=token="$DD_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/datadog-rbac.yaml
          kubectl apply -f k8s/datadog-configmap.yaml
          kubectl apply -f k8s/datadog-cluster-agent.yaml
          kubectl apply -f k8s/datadog-agent-daemonset.yaml

          kubectl -n datadog rollout status deployment/datadog-cluster-agent --timeout=5m
          kubectl -n datadog rollout status daemonset/datadog-agent --timeout=5m

      - name: Deploy ConfigMap
        run: |
          kubectl apply \
            -f k8s/api-configmap.yaml \
            -n oficina

      - name: Deploy API Secrets
        run: |
          kubectl apply \
            -f k8s/api-secrets.yaml \
            -n oficina

      - name: Deploy Application
        run: |
          kubectl apply \
            -f k8s/api-deployment.yaml \
            -n oficina

          kubectl apply \
            -f k8s/api-service.yaml \
            -n oficina

          kubectl apply \
            -f k8s/api-service-nlb.yaml \
            -n oficina

          kubectl apply \
            -f k8s/api-hpa.yaml \
            -n oficina

      - name: Restart API
        run: |
          kubectl -n oficina rollout restart deployment/api
          kubectl -n oficina rollout status deployment/api --timeout=5m

      - name: Get Service Info
        run: |
          kubectl get svc,pods,hpa -n oficina
          kubectl get pods -n datadog
