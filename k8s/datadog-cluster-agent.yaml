apiVersion: v1
kind: Service
metadata:
  name: datadog-cluster-agent
  namespace: datadog
  labels:
    app: datadog-cluster-agent
    app.kubernetes.io/name: datadog-cluster-agent
    app.kubernetes.io/part-of: autorepairshop
spec:
  type: ClusterIP
  selector:
    app: datadog-cluster-agent
  ports:
    - port: 5005
      name: agentport
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadog-cluster-agent
  namespace: datadog
  labels:
    app: datadog-cluster-agent
    app.kubernetes.io/name: datadog-cluster-agent
    app.kubernetes.io/part-of: autorepairshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datadog-cluster-agent
  template:
    metadata:
      labels:
        app: datadog-cluster-agent
        app.kubernetes.io/name: datadog-cluster-agent
        app.kubernetes.io/part-of: autorepairshop
    spec:
      serviceAccountName: datadog-cluster-agent
      containers:
        - name: cluster-agent
          image: gcr.io/datadoghq/cluster-agent:7.57.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
              name: agentport
              protocol: TCP
          envFrom:
            - configMapRef:
                name: datadog-config
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: api-key
            - name: DD_CLUSTER_AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: token
            - name: DD_COLLECT_KUBERNETES_EVENTS
              value: "true"
            - name: DD_LEADER_ELECTION
              value: "true"
            - name: DD_EXTERNAL_METRICS_PROVIDER_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /live
              port: 5555
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 5555
            initialDelaySeconds: 15
            periodSeconds: 10
